<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ayşe Yaman Danışmanlık | Dijital Kartvizit</title>

  <style>
    :root{
      --bg:#ffffff;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e5e7eb;
      --shadow: 0 12px 30px rgba(15, 23, 42, .08);

      --btnBg:#ffffff;
      --btnHover:#f8fafc;
      --btnText:#0f172a;

      --waBorder:#86efac;
      --waBg:#f0fdf4;
      --waHover:#dcfce7;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px;
    }

    .wrap{ width:100%; max-width: 520px; }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .header{
      text-align:center;
      padding-bottom: 10px;
    }

    .logoBox{
      display:flex;
      justify-content:center;
    }

    .logoBox img{
      width:100%;
      max-width:320px;
      border-radius:14px;
    }

    .subtitle{
      margin-top:10px;
      font-size:13px;
      color:var(--muted);
      letter-spacing:.6px;
      text-transform:uppercase;
    }

    .divider{
      height:1px;
      background: var(--line);
      margin: 14px 0;
    }

    /* GRID YAPI */
    .actions{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      text-decoration:none;
      color: var(--btnText);
      background: var(--btnBg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 8px;
      transition: background .12s ease, transform .06s ease, border-color .12s ease;
      box-shadow: 0 6px 16px rgba(15,23,42,.06);
      text-align:center;
      min-height:88px;
    }

    .btn:hover{
      background: var(--btnHover);
      border-color:#d1d5db;
    }

    .btn:active{ transform:scale(.98); }

    .icon{
      width:38px;
      height:38px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid var(--line);
      background:#f8fafc;
      font-size:18px;
    }

    .label{
      font-size:12.5px;
      font-weight:600;
      line-height:1.2;
    }

    /* WhatsApp özel */
    .btn.whatsapp{
      border-color: var(--waBorder);
      background: var(--waBg);
    }
    .btn.whatsapp:hover{
      background: var(--waHover);
    }

    /* Mobil uyum */
    @media (max-width: 600px){
      .actions{
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .footer{
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid var(--line);
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }
    .footer b{ color:var(--text); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="header">
        <div class="logoBox">
          <img src="logo.png" alt="Ayşe Yaman Danışmanlık">
        </div>
        <div class="subtitle">Enerji ve Teşvik Danışmanlık Hizmetleri</div>
      </div>

      <div class="divider"></div>

      <div class="actions">

        <a class="btn" href="https://ayseyaman.com.tr/" target="_blank">
          <div class="icon">🌐</div>
          <div class="label">Web</div>
        </a>

        <a class="btn whatsapp"
           href="https://wa.me/905313003388?text=Merhaba%2C%20danismanlik%20hizmetleriniz%20hakkinda%20bilgi%20almak%20istiyorum."
           target="_blank">
          <div class="icon">💬</div>
          <div class="label">WhatsApp</div>
        </a>

        <a class="btn" href="tel:+905313003388">
          <div class="icon">📞</div>
          <div class="label">Telefon</div>
        </a>

        <a class="btn" href="mailto:danismanlik@ayseyaman.com.tr">
          <div class="icon">✉️</div>
          <div class="label">E-posta</div>
        </a>

        <a class="btn" href="https://www.linkedin.com/in/ayseyamandanismanlik" target="_blank">
          <div class="icon">💼</div>
          <div class="label">LinkedIn</div>
        </a>

        <a class="btn" href="https://www.instagram.com/ayseyamandanismanlik/" target="_blank">
          <div class="icon">📷</div>
          <div class="label">Instagram</div>
        </a>

        <a class="btn" href="https://youtube.com/@ayseyamandanismanlik?si=X8DnZHS8LYbRsWHK" target="_blank">
          <div class="icon">▶️</div>
          <div class="label">YouTube</div>
        </a>

        <a class="btn" href="https://calendly.com/danismanlik-ayseyaman/30min?back=1&month=2026-01"_blank">
          <div class="icon">📅</div>
          <div class="label">Randevu Al</div>
        </a>

      </div>

      <div class="footer">
        <b>AYŞE YAMAN DANIŞMANLIK</b> · Dijital kartvizit
      </div>

    </div>
  </div>
</body>
</html>
