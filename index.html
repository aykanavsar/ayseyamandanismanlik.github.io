<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ayşe Yaman Danışmanlık - Dijital Kartvizit" />
  <title>Ayşe Yaman Danışmanlık | Dijital Kartvizit</title>

  <style>
    :root{
      --bg: #0f172a;
      --card: rgba(255,255,255,.08);
      --card2: rgba(255,255,255,.06);
      --text: #e5e7eb;
      --muted: rgba(229,231,235,.75);
      --line: rgba(229,231,235,.14);
      --btn: rgba(255,255,255,.10);
      --btnHover: rgba(255,255,255,.16);
      --accent: #22c55e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      background: radial-gradient(1200px 700px at 20% 10%, rgba(34,197,94,.18), transparent 60%),
                  radial-gradient(900px 600px at 90% 30%, rgba(59,130,246,.16), transparent 55%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px;
    }
    .wrap{width: min(560px, 100%);}
    .card{
      background: linear-gradient(180deg, var(--card), var(--card2));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    .brand{
      display:flex;
      gap:14px;
      align-items:center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
    }
    .mark{
      width:52px;height:52px;border-radius: 16px;
      background: rgba(34,197,94,.15);
      border: 1px solid rgba(34,197,94,.30);
      display:flex;align-items:center;justify-content:center;
      font-weight: 800;
      letter-spacing:.5px;
      color: var(--accent);
      user-select:none;
    }
    h1{
      font-size: 20px;
      line-height: 1.2;
      margin:0;
      letter-spacing:.2px;
    }
    .sub{
      margin-top:6px;
      font-size: 13.5px;
      color: var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      width:100%;
      text-decoration:none;
      color: var(--text);
      background: var(--btn);
      border: 1px solid var(--line);
      padding: 14px 14px;
      border-radius: 16px;
      transition: transform .06s ease, background .12s ease, border-color .12s ease;
    }
    .btn:hover{background: var(--btnHover); border-color: rgba(229,231,235,.22)}
    .btn:active{transform: scale(.99)}
    .left{
      display:flex;align-items:center;gap:12px;min-width:0;
    }
    .icon{
      width:38px;height:38px;border-radius: 12px;
      display:flex;align-items:center;justify-content:center;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.10);
      flex: 0 0 auto;
    }
    .label{
      display:flex;flex-direction:column;gap:2px;min-width:0;
    }
    .label b{font-size: 14.5px}
    .label span{
      font-size: 12.5px;
      color: var(--muted);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      max-width: 340px;
    }
    .arrow{opacity:.65; flex: 0 0 auto}

    .footer{
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display:flex;
      gap:10px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items:center;
      color: var(--muted);
      font-size: 12px;
    }
    .miniActions{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .mini{
      cursor:pointer;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 12.5px;
    }
    .mini:hover{background: rgba(255,255,255,.10)}
    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.18);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .18s ease;
      max-width: min(560px, calc(100% - 40px));
    }
    .toast.show{opacity: 1;}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <div class="mark">AY</div>
        <div>
          <h1>AYŞE YAMAN DANIŞMANLIK</h1>
          <div class="sub">Enerji ve Sürdürülebilirlik Danışmanlığı</div>
        </div>
      </div>

      <div class="grid">
        <a class="btn" href="https://ayseyaman.com.tr/" target="_blank" rel="noopener">
          <div class="left">
            <div class="icon">🌐</div>
            <div class="label">
              <b>Web Sitesi</b>
              <span>ayseyaman.com.tr</span>
            </div>
          </div>
          <div class="arrow">↗</div>
        </a>

        <a class="btn" href="mailto:danismanlik@ayseyaman.com.tr">
          <div class="left">
            <div class="icon">✉️</div>
            <div class="label">
              <b>E-posta</b>
              <span>danismanlik@ayseyaman.com.tr</span>
            </div>
          </div>
          <div class="arrow">↗</div>
        </a>

        <a class="btn" href="tel:+905313003388">
          <div class="left">
            <div class="icon">📞</div>
            <div class="label">
              <b>Telefon</b>
              <span>+90 531 300 33 88</span>
            </div>
          </div>
          <div class="arrow">↗</div>
        </a>

        <a class="btn" href="https://www.linkedin.com/in/ayseyamandanismanlik" target="_blank" rel="noopener">
          <div class="left">
            <div class="icon">💼</div>
            <div class="label">
              <b>LinkedIn</b>
              <span>linkedin.com/in/ayseyamandanismanlik</span>
            </div>
          </div>
          <div class="arrow">↗</div>
        </a>

        <a class="btn" href="https://www.instagram.com/ayseyamandanismanlik/" target="_blank" rel="noopener">
          <div class="left">
            <div class="icon">📷</div>
            <div class="label">
              <b>Instagram</b>
              <span>@ayseyamandanismanlik</span>
            </div>
          </div>
          <div class="arrow">↗</div>
        </a>
      </div>

      <div class="footer">
        <div>Dijital kartvizit</div>
        <div class="miniActions">
          <button class="mini" onclick="copyLink()">Linki kopyala</button>
          <button class="mini" onclick="shareCard()">Paylaş</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Kopyalandı</div>

  <script>
    function toast(msg){
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(()=>t.classList.remove("show"), 1400);
    }

    async function copyLink(){
      const url = window.location.href;
      try{
        await navigator.clipboard.writeText(url);
        toast("Link kopyalandı");
      }catch(e){
        // fallback
        const tmp = document.createElement("textarea");
        tmp.value = url;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand("copy");
        document.body.removeChild(tmp);
        toast("Link kopyalandı");
      }
    }

    async function shareCard(){
      const data = {
        title: "Ayşe Yaman Danışmanlık",
        text: "AYŞE YAMAN DANIŞMANLIK - Enerji ve Sürdürülebilirlik Danışmanlığı",
        url: window.location.href
      };
      if (navigator.share){
        try{
          await navigator.share(data);
        }catch(e){
          // user cancelled
        }
      }else{
        await copyLink();
        toast("Paylaşım yok, link kopyalandı");
      }
    }
  </script>
</body>
</html>
