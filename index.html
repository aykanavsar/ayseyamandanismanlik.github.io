<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ayşe Yaman Danışmanlık | Dijital Kartvizit</title>

  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#111827;
      --line: rgba(255,255,255,.10);
      --text:#ffffff;
      --muted: rgba(255,255,255,.72);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(255,255,255,.10), transparent 60%),
        radial-gradient(900px 500px at 90% 30%, rgba(255,255,255,.06), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      color:var(--text);
    }
    .wrap{width:100%;max-width:440px;}
    .card{
      background: rgba(15,23,42,.70);
      border:1px solid var(--line);
      border-radius:22px;
      padding:18px;
      box-shadow:0 22px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
    }
    .logoBox{
      background:#ffffff;
      border-radius:18px;
      padding:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.22);
      border:1px solid rgba(0,0,0,.06);
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:14px;
    }
    .logoBox img{
      width:100%;
      max-width:360px;
      height:auto;
      border-radius:12px;
    }
    .hint{
      text-align:center;
      font-size:12.5px;
      color:var(--muted);
      margin:10px 0 14px;
    }
    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-decoration:none;
      color:#fff;
      background: rgba(17,24,39,.85);
      border:1px solid var(--line);
      padding:14px;
      border-radius:16px;
      margin-bottom:10px;
      font-size:15px;
    }
    .btn:hover{background:#1f2937;}
    .footer{
      margin-top:10px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="logoBox">
        <img src="logo.png" alt="Ayşe Yaman Danışmanlık Logosu">
      </div>

      <div class="hint">İletişim ve içerikler için aşağıdaki bağlantıları kullanabilirsiniz.</div>

      <a class="btn" href="https://ayseyaman.com.tr/" target="_blank" rel="noopener">🌐 Web Sitesi</a>
      <a class="btn" href="tel:+905313003388">📞 Telefon</a>
      <a class="btn" href="mailto:danismanlik@ayseyaman.com.tr">✉️ E-posta</a>
      <a class="btn" href="https://www.linkedin.com/in/ayseyamandanismanlik" target="_blank" rel="noopener">💼 LinkedIn</a>
      <a class="btn" href="https://www.instagram.com/ayseyamandanismanlik/" target="_blank" rel="noopener">📷 Instagram</a>
      <a class="btn" href="https://youtube.com/@ayseyamandanismanlik?si=X8DnZHS8LYbRsWHK" target="_blank" rel="noopener">▶️ YouTube</a>

      <div class="footer">AYŞE YAMAN DANIŞMANLIK</div>
    </div>
  </div>
</body>
</html>
