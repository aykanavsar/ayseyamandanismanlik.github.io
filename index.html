<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ayşe Yaman Danışmanlık | Dijital Kartvizit</title>

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:#ffffff;
      color:#111827;
    }
    .wrap{width:100%;max-width:420px;}
    .card{
      background:#ffffff;
      border:1px solid #e5e7eb;
      border-radius:20px;
      padding:22px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      text-align:center;
    }

    .logo img{
      width:100%;
      max-width:320px;
      height:auto;
    }

    .divider{
      margin:18px 0;
      height:1px;
      background:#e5e7eb;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-decoration:none;
      color:#111827;
      background:#f9fafb;
      border:1px solid #e5e7eb;
      padding:14px;
      border-radius:14px;
      margin-bottom:10px;
      font-size:15px;
    }
    .btn:hover{
      background:#f3f4f6;
    }

    .footer{
      margin-top:12px;
      font-size:12px;
      color:#6b7280;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="logo">
        <img src="logo.png" alt="Ayşe Yaman Danışmanlık">
      </div>

      <div class="divider"></div>

      <a class="btn" href="https://ayseyaman.com.tr/" target="_blank">🌐 Web Sitesi</a>
      <a class="btn" href="tel:+905313003388">📞 Telefon</a>
      <a class="btn" href="mailto:danismanlik@ayseyaman.com.tr">✉️ E-posta</a>
      <a class="btn" href="https://www.linkedin.com/in/ayseyamandanismanlik" target="_blank">💼 LinkedIn</a>
      <a class="btn" href="https://www.instagram.com/ayseyamandanismanlik/" target="_blank">📷 Instagram</a>
      <a class="btn" href="https://youtube.com/@ayseyamandanismanlik?si=X8DnZHS8LYbRsWHK" target="_blank">▶️ YouTube</a>

      <div class="footer">AYŞE YAMAN DANIŞMANLIK</div>
    </div>
  </div>
</body>
</html>
